<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>???</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #000000;
    --ink: #e8e6f0;
    --ink-soft: #a8a4b8;
    --line: #1f1d28;
    --accent: #b6a8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  #game {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0a0e;
  }
  .hud {
    position: fixed;
    top: 14px; left: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    z-index: 5;
    pointer-events: none;
    line-height: 1.7;
  }
  .hud .who { color: var(--accent); }
  .hint {
    position: fixed;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--ink-soft);
    z-index: 5;
    opacity: 0.7;
  }
  .back {
    position: fixed;
    top: 14px; right: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: none;
    z-index: 5;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 6px;
  }
  .back:hover { color: var(--accent); border-color: var(--accent); }
  .offline-note {
    position: fixed;
    bottom: 14px; right: 16px;
    font-size: 11px;
    color: #d8a84a;
    z-index: 5;
    opacity: 0.85;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.94);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  #passOverlay { background: #000; }
  .overlay .box { text-align: center; max-width: 420px; }
  .overlay h1 { font-size: 18px; font-weight: 500; color: var(--accent); margin-bottom: 6px; }
  .overlay p { font-size: 12px; color: var(--ink-soft); margin-bottom: 18px; }
  .overlay input {
    background: #0a0a0e;
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
    text-align: center;
    width: 220px;
  }
  .overlay input:focus { border-color: var(--accent); }
  .overlay .go {
    display: block;
    margin: 16px auto 0;
    font: inherit;
    font-size: 13px;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 9px 22px;
    border-radius: 8px;
    cursor: pointer;
  }
  #passError {
    font-size: 11px;
    color: #c25b4a;
    margin-top: 10px;
    min-height: 14px;
  }

  /* customization */
  #custPreview {
    image-rendering: pixelated;
    width: 72px; height: 150px;
    display: block;
    margin: 0 auto 14px;
    background: #0f0d18;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .cust-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .cust-row label {
    font-size: 10px;
    color: var(--ink-soft);
    width: 62px;
    text-align: right;
    flex-shrink: 0;
  }
  .swatch {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1px solid var(--line);
    cursor: pointer;
    padding: 0;
  }
  .swatch.sel { border: 2px solid var(--accent); }
  .style-btn {
    font: inherit;
    font-size: 10px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    background: none;
    border-radius: 5px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .style-btn.sel { color: var(--accent); border-color: var(--accent); }
  #custName { margin-top: 10px; }

  /* chat */
  #chat {
    position: fixed;
    left: 16px; bottom: 40px;
    width: 250px;
    z-index: 8;
    font-size: 11px;
  }
  #chatLog {
    max-height: 170px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 6px;
    scrollbar-width: none;
  }
  #chatLog .msg {
    background: rgba(10,10,14,0.75);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 8px;
    color: var(--ink);
    width: fit-content;
    max-width: 100%;
    word-wrap: break-word;
  }
  #chatLog .msg b { color: var(--accent); font-weight: 500; }
  #chatInput {
    width: 100%;
    background: rgba(10,10,14,0.85);
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    padding: 7px 10px;
    border-radius: 7px;
    outline: none;
  }
  #chatInput:focus { border-color: var(--accent); }

  /* build panel */
  #buildPanel {
    position: fixed;
    left: 50%; bottom: 40px;
    transform: translateX(-50%);
    display: none;
    gap: 8px;
    background: rgba(10,10,14,0.95);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    z-index: 10;
  }
  #buildPanel.open { display: flex; }
  .build-item {
    width: 56px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 4px 4px;
    text-align: center;
    cursor: pointer;
    background: none;
  }
  .build-item canvas { image-rendering: pixelated; width: 32px; height: 32px; display: block; margin: 0 auto; }
  .build-item span { font-size: 9px; color: var(--ink-soft); display: block; margin-top: 3px; }
  .build-item.sel { border-color: var(--accent); background: rgba(182,168,232,0.08); }
  .build-item.sel span { color: var(--accent); }

  /* notes */
  #notesBtn {
    position: fixed;
    top: 52px; right: 16px;
    font: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    z-index: 5;
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #notesBtn:hover { color: var(--accent); border-color: var(--accent); }
  #notesPanel {
    position: fixed;
    inset: 4vh 4vw;
    background: #12101a;
    border: 1px solid var(--line);
    border-radius: 12px;
    z-index: 30;
    display: none;
    overflow: hidden;
  }
  #notesPanel.open { display: flex; }
  #notesSide {
    width: 170px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  #noteNew {
    font: inherit;
    font-size: 11px;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 7px;
    cursor: pointer;
  }
  #notesList { display: flex; flex-direction: column; gap: 5px; }
  .note-item {
    font: inherit;
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
    background: none;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note-item.sel { color: var(--accent); border-color: var(--accent); }
  #notesMain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #notesBar {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  #noteTitle {
    flex: 1;
    min-width: 110px;
    background: #0a0a0e;
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    outline: none;
  }
  #noteTitle:focus { border-color: var(--accent); }
  .nbtn {
    font: inherit;
    font-size: 10px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    background: none;
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nbtn:hover { color: var(--ink); }
  .nbtn.sel { color: var(--accent); border-color: var(--accent); }
  #drawTools { display: none; gap: 6px; align-items: center; }
  #notesPanel.drawing #drawTools { display: inline-flex; }
  .ink-swatch {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1px solid var(--line);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .ink-swatch.sel { border: 2px solid var(--accent); }
  #noteBody {
    flex: 1;
    overflow: auto;
    background: #17141f;
    padding: 14px;
  }
  #paper {
    position: relative;
    width: 720px;
    height: 960px;
    margin: 0 auto;
    background: #f7f5ef;
    border-radius: 4px;
  }
  #noteText {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    resize: none;
    outline: none;
    color: #26233a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 24px;
    padding: 24px;
  }
  #noteInk {
    position: absolute;
    inset: 0;
    width: 720px;
    height: 960px;
    pointer-events: none;
    touch-action: none;
  }
  #notesPanel.drawing #noteInk { pointer-events: auto; cursor: crosshair; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="who" id="hudName"></div>
  <div id="hudPlayers"></div>
</div>
<a class="back" href="index.html">← leave</a>
<button id="notesBtn">✎ notes</button>
<div class="hint">WASD move · B build · N notes · click place · right-click remove · E at wardrobe</div>
<div class="offline-note" id="offlineNote" style="display:none">offline mode — no firebase config</div>

<div class="overlay" id="passOverlay" style="display:none">
  <div class="box">
    <h1>locked</h1>
    <p>this is limited access</p>
    <input id="emailInput" type="email" placeholder="email" autocomplete="off"/>
    <div style="height:10px"></div>
    <input id="passInput" type="password" placeholder="password" autocomplete="off"/>
    <div id="passError"></div>
    <button class="go" id="passGo">unlock</button>
  </div>
</div>

<div class="overlay" id="custOverlay" style="display:none">
  <div class="box">
    <h1>you found the room</h1>
    <p>make your character</p>
    <canvas id="custPreview" width="24" height="50"></canvas>
    <div id="custRows"></div>
    <input id="nameInput" maxlength="12" placeholder="name" autocomplete="off"/>
    <button class="go" id="custGo">enter</button>
  </div>
</div>

<div id="chat">
  <div id="chatLog"></div>
  <input id="chatInput" maxlength="120" placeholder="press enter to chat" autocomplete="off"/>
</div>

<div id="buildPanel"></div>

<div id="notesPanel">
  <div id="notesSide">
    <button id="noteNew">+ new note</button>
    <div id="notesList"></div>
  </div>
  <div id="notesMain">
    <div id="notesBar">
      <input id="noteTitle" maxlength="60" placeholder="title" autocomplete="off"/>
      <button class="nbtn sel" id="modeType">type</button>
      <button class="nbtn" id="modeDraw">draw</button>
      <span id="drawTools">
        <button class="nbtn sel" id="toolPen">pen</button>
        <button class="nbtn" id="toolEraser">eraser</button>
        <span id="inkColors" style="display:inline-flex;gap:5px;"></span>
      </span>
      <button class="nbtn" id="exportPng">↓ png</button>
      <button class="nbtn" id="exportTxt">↓ txt</button>
      <button class="nbtn" id="noteDelete">delete</button>
      <button class="nbtn" id="notesClose">close</button>
    </div>
    <div id="noteBody">
      <div id="paper">
        <textarea id="noteText" placeholder="notes…" spellcheck="false"></textarea>
        <canvas id="noteInk" width="1440" height="1920"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="room.js"></script>
</body>
</html>
